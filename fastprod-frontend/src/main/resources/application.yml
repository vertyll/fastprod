spring:
  application:
    name: fastprod-frontend
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

server:
  port: 8001
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 10h
      cookie:
        name: __Host-FASTPROD_SESSION
        path: /
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

vaadin:
  launch-browser: false
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.vertyll.fastprod

application:
  keycloak:
    client-id: fastprod-frontend

logging:
  level:
    org.atmosphere: WARN
