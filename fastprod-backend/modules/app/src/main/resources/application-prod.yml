spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    clean-disabled: true

security:
  keycloak:
    realm-url: ${KEYCLOAK_REALM_URL}

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

application:
  file:
    uploads:
      file-output-path: ${FILE_UPLOAD_PATH}
  frontend:
    url: ${FRONTEND_URL}

logging:
  level:
    root: WARN
    com.vertyll.fastprod: INFO
