spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    validate-on-migrate: true

security:
  keycloak:
    realm-url: http://localhost:8182/realms/fastprod

keycloak:
  admin:
    server-url: http://localhost:8182
    client-secret: test-secret

application:
  file:
    uploads:
      file-output-path: ./test-uploads

  frontend:
    url: http://localhost:8001

server:
  port: 0
