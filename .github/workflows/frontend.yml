name: Frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "fastprod-frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/_image.yml"
  pull_request:
    branches: [main]
    paths:
      - "fastprod-frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/_image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fastprod-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew check -x test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-lint-reports
          path: fastprod-frontend/**/build/reports/
          if-no-files-found: ignore

  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fastprod-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      - name: Analyze
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: fastprod-frontend/**/build/reports/
          if-no-files-found: ignore

  image:
    name: Image
    needs: [lint, test]
    if: github.event_name != 'push' || github.ref_type == 'tag'
    uses: ./.github/workflows/_image.yml
    with:
      context: .
      dockerfile: ./fastprod-frontend/Dockerfile
      image-name: vertyll/fastprod-frontend
      tag-prefix: v
    secrets: inherit
